[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
addopts = -ra --strict-markers --strict-config
markers =
    unit: tests of isolated business rules and pure helpers
    integration: tests that combine the API, services, and temporary database
    e2e: tests that exercise a complete user flow through the API
    postgres_e2e: tests that use the configured PostgreSQL database
