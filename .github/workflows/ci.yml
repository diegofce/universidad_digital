name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test and coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: universidad_qa
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d universidad_qa"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Prepare QA credentials
        shell: bash
        run: |
          admin_password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          teacher_password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          jwt_secret="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$teacher_password"
          echo "::add-mask::$jwt_secret"
          echo "QA_ADMIN_EMAIL=qa-admin@qa-universidad.com" >> "$GITHUB_ENV"
          echo "QA_TEACHER_EMAIL=qa-teacher@qa-universidad.com" >> "$GITHUB_ENV"
          echo "QA_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          echo "QA_TEACHER_PASSWORD=$teacher_password" >> "$GITHUB_ENV"
          echo "CYPRESS_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          echo "APP_JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"

      - name: Create QA schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/universidad_qa
          APP_ENV: development
          APP_COOKIE_SECURE: 'false'
          APP_CORS_ORIGINS: http://localhost:3000
        run: python -c "from app.core.database import create_tables; create_tables()"

      - name: Seed QA accounts
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/universidad_qa
          APP_ENV: development
          APP_COOKIE_SECURE: 'false'
          APP_CORS_ORIGINS: http://localhost:3000
        run: python -m scripts.seed_qa

      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/universidad_qa
          APP_ENV: development
          APP_COOKIE_SECURE: 'false'
          APP_CORS_ORIGINS: http://localhost:3000
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/health

      - name: Start frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: |
          nohup npm run dev -- --host localhost --port 3000 > "$RUNNER_TEMP/frontend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/frontend.pid"
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://localhost:3000

      - name: Run Cypress E2E
        working-directory: frontend
        env:
          CYPRESS_BASE_URL: http://localhost:3000
          CYPRESS_API_URL: http://localhost:8000/api/v1
          CYPRESS_ADMIN_EMAIL: qa-admin@qa-universidad.com
          CYPRESS_TEACHER_SEARCH: qa
          CYPRESS_ALLOW_DB_WRITES: 'true'
          CYPRESS_RESPONSE_BUDGET_MS: '10000'
        run: npm run cy:run

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-evidence
          path: |
            frontend/cypress/screenshots
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/frontend.log
          if-no-files-found: ignore
